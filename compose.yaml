services:
  app:
    build: .
    image: erlangc-forecast
    env_file:
      - path: .env
        required: false
    # Localhost only: ciap-api calls this service; browsers should not reach it directly.
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8010"
    volumes:
      # A named volume is writable by the container's non-root user (a host folder often is not).
      - logs:/app/logs
    mem_limit: ${APP_MEM_LIMIT:-2g}
    read_only: true
    # Uploads are spooled here (at most ~251 MB per request; see MAX_REQUEST_BYTES).
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  logs:
